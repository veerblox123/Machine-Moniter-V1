name: Build Linux desktop release

on:
  push:
    branches: ['release/**']
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install build dependencies
        run: npm install

      - name: Build AppImage and Debian package
        run: npm run dist:linux

      - name: Choose release tag
        id: release-tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/heads/release/* ]]; then
            echo "tag=${GITHUB_REF_NAME#release/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish downloadable packages
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release-tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Machine Monitor ${{ steps.release-tag.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/*.AppImage
            dist/*.deb
